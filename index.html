	<script>
	(function () {
		'use strict';

		var doc = document;
		var lastFocused = null;
		var openModalEl = null;
		var FOCUSABLE = 'a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])';

		function onLoad() {
			doc.body.classList.remove('is-preload');
		}
		if (doc.readyState === 'complete' || doc.readyState === 'interactive') {
			window.setTimeout(onLoad, 0);
		} else {
			window.addEventListener('DOMContentLoaded', onLoad);
		}

		function openModal(id, trigger) {
			var m = doc.getElementById(id);
			if (!m) { return; }
			lastFocused = trigger || doc.activeElement;
			m.removeAttribute('hidden');           /* 先解除 hidden，才能聚焦 */
			m.classList.add('is-open');
			openModalEl = m;
			doc.body.style.overflow = 'hidden';

			var btn = m.querySelector('[data-close]');
			if (btn) { btn.focus(); }
		}

		function closeModal(m) {
			if (!m || !m.classList.contains('is-open')) { return; }
			m.classList.remove('is-open');
			m.setAttribute('hidden', '');          /* 隐藏后其内部按钮不再进入 Tab 序列 */
			if (openModalEl === m) { openModalEl = null; }
			if (!doc.querySelector('.modal.is-open')) {
				doc.body.style.overflow = '';
			}
			/* 归还焦点：先确认触发元素仍在文档中，避免元素被移除后 focus() 抛错 */
			if (lastFocused && typeof lastFocused.focus === 'function' && doc.contains(lastFocused)) {
				lastFocused.focus();
			}
			lastFocused = null;
		}

		/* 统一关闭入口：复用 closeModal，保证「点关闭钮」与「Esc」两条路径
		   都执行焦点归还 + 解锁滚动（此前 closeAll 漏了焦点归还，导致 Esc
		   关闭后焦点悬空到 body，键盘用户丢失位置） */
		function closeAll() {
			var open = doc.querySelectorAll('.modal.is-open');
			for (var i = 0; i < open.length; i++) {
				closeModal(open[i]);
			}
		}

		/* 复制到剪贴板：优先 Clipboard API，失败降级 execCommand */
		function copyText(text) {
			if (navigator.clipboard && navigator.clipboard.writeText) {
				return navigator.clipboard.writeText(text).then(function () {
					return true;
				}).catch(function () {
					return fallbackCopy(text);
				});
			}
			return Promise.resolve(fallbackCopy(text));
		}

		function fallbackCopy(text) {
			try {
				var ta = doc.createElement('textarea');
				ta.value = text;
				ta.setAttribute('readonly', '');
				ta.style.position = 'fixed';
				ta.style.top = '-9999px';
				ta.style.opacity = '0';
				doc.body.appendChild(ta);
				ta.select();
				ta.setSelectionRange(0, text.length);
				var ok = doc.execCommand('copy');
				doc.body.removeChild(ta);
				return !!ok;
			} catch (err) {
				return false;
			}
		}

		function handleCopy(btn) {
			var text = btn.getAttribute('data-copy') || '';
			var label = btn.querySelector('.mail-copy-label') || btn;

			copyText(text).then(function (ok) {
				label.textContent = ok ? '已复制到剪贴板' : '复制失败，请手动选中';
				btn.classList.add(ok ? 'is-done' : 'is-fail');
				window.clearTimeout(btn._copyTimer);
				btn._copyTimer = window.setTimeout(function () {
					label.textContent = '复制邮箱地址';
					btn.classList.remove('is-done', 'is-fail');
				}, ok ? 2000 : 3200);
			});
		}

		/* 点击：打开 / 关闭 / 点遮罩关闭 / 复制 */
		doc.addEventListener('click', function (ev) {
			var t = ev.target;
			while (t && t !== doc) {
				if (t.hasAttribute && t.hasAttribute('data-copy')) {
					ev.preventDefault();
					handleCopy(t);
					return;
				}
				if (t.hasAttribute && t.hasAttribute('data-modal')) {
					ev.preventDefault();
					openModal(t.getAttribute('data-modal'), t);
					return;
				}
				if (t.hasAttribute && t.hasAttribute('data-close')) {
					closeModal(t.closest('.modal'));
					return;
				}
				t = t.parentNode;
			}
			if (ev.target.classList && ev.target.classList.contains('modal')) {
				closeModal(ev.target);
			}
		});

		/* 键盘：Esc 关闭 + Tab 焦点锁定在弹窗内 */
		doc.addEventListener('keydown', function (ev) {
			if (ev.key === 'Escape') {
				closeAll();
				return;
			}
			if (ev.key === 'Tab' && openModalEl) {
				var items = openModalEl.querySelectorAll(FOCUSABLE);
				if (!items.length) { return; }
				var first = items[0];
				var last = items[items.length - 1];
				if (ev.shiftKey && doc.activeElement === first) {
					ev.preventDefault();
					last.focus();
				} else if (!ev.shiftKey && doc.activeElement === last) {
					ev.preventDefault();
					first.focus();
				}
			}
		});

		/* 移动端：阻止页面整体上下拖拽回弹；弹窗内的滚动容器放行。
		   判定方式：从事件目标向上找，遇到弹窗或其内部可滚动容器则放行。 */
		window.addEventListener('touchmove', function (e) {
			var t = e.target;
			while (t && t !== doc) {
				if (t.classList && t.classList.contains('modal')) { return; }
				t = t.parentNode;
			}
			/* 其他区域仍阻止（原行为，防 iOS 整页回弹） */
			e.preventDefault();
		}, { passive: false });

		window.addEventListener('orientationchange', function () {
			window.scrollTo(0, 0);
		});
	})();
	</script>

	<!--
		反调试（可选）：

	-->
	<script src="https://cdn.jsdelivr.net/npm/disable-devtool@0.3.9/disable-devtool.min.js" defer></script>
	<script>
		/* defer 脚本执行完即代表 DOM 已就绪；这里做双重保险，
		   脚本加载失败（CDN 挂了）也不影响页面其余功能。 */
		function initAntiDebug() {
			if (typeof window.DisableDevtool === 'function') {
				window.DisableDevtool({
					md5: '',
					url: '',
					timeOutUrl: '',
					disableMenu: false,
					clearIntervalWhenDevOpenTrigger: false,
					ondevtoolopen: function (type) {
						console.warn('检测到开发者工具已打开 (type=' + type + ')。');
					}
				});
			}
		}
		if (document.readyState === 'loading') {
			window.addEventListener('DOMContentLoaded', initAntiDebug);
		} else {
			initAntiDebug();
		}
	</script>
